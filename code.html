<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Impressive</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        h1 {
            margin-top: 20%;
            font-size: 3rem;
            color: #333;
        }
    </style>
</head>
<body>
    <h1 id="message">Loading...</h1>

    <script>
        // JavaScript to dynamically write the message
        window.onload = function() {
            const messageElement = document.getElementById('message');
            messageElement.textContent = 'Your impressive';
        };
    </script>
</body>
</html>
